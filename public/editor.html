<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dino Girl · Level-Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="icon" href="img/dino-girl-sprite.png">
  <style>
    :root{--ink:#071229;--cream:#fff3d5;--lime:#9fca31;--amber:#f7c742;--coral:#ef4b45;--line:#4a5c55;--panel:#0c1f23}
    *{box-sizing:border-box;min-width:0}
    html,body{margin:0;height:100%;background:#0b0d12;color:var(--cream);font:18px "VT323",monospace}
    body{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh}
    header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;background:#06080c;border-bottom:4px solid #1a1710}
    header h1{font:12px "Press Start 2P",monospace;margin:0 14px 0 0;color:var(--lime)}
    header h1 small{color:var(--amber);margin-left:8px}
    button,select,input{font:16px "VT323",monospace;color:var(--cream);background:#162427;border:3px solid var(--line);padding:5px 9px;border-radius:0}
    button{cursor:pointer;box-shadow:3px 3px 0 #000}
    button:hover{border-color:var(--amber)}
    button.go{background:var(--lime);color:#101a0d;border-color:#efff9a;font-weight:bold}
    button.on{border-color:var(--amber);background:#3a2f10}
    input{width:84px}
    main{display:grid;grid-template-columns:170px minmax(0,1fr) 300px;min-height:0}
    .tools{display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--panel);border-right:4px solid #1a1710;overflow-y:auto}
    .tools button{text-align:left}
    .tools label{font-size:15px;color:#9fb2a8;margin-top:6px}
    .view{overflow:auto;position:relative;background:#050812}
    #ed{display:block;image-rendering:pixelated;cursor:crosshair}
    aside{padding:12px;background:var(--panel);border-left:4px solid #1a1710;overflow-y:auto}
    aside h2{font:10px "Press Start 2P",monospace;color:var(--amber);margin:4px 0 10px}
    .row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
    .row label{width:80px;color:#9fb2a8}
    .zone{border:2px solid #2a3c38;padding:6px;margin:8px 0}
    footer{padding:6px 14px;background:#17150f;color:#b7aa83;font-size:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    dialog{background:var(--panel);color:var(--cream);border:4px solid var(--amber);max-width:min(900px,94vw);width:900px}
    dialog textarea{width:100%;height:50vh;background:#06080c;color:#cfe;border:2px solid var(--line);font:13px monospace}
    a{color:var(--amber)}
    @media(max-width:900px){main{grid-template-columns:120px minmax(0,1fr)}aside{display:none}}
  </style>
</head>
<body>
  <header>
    <h1>DINO GIRL <small>LEVEL-EDITOR</small></h1>
    <label>Vorlage <select id="tpl"></select></label>
    <button id="loadTpl">LADEN</button>
    <button id="newLvl">LEER</button>
    <label>Zoom <select id="zoom"><option value=".35">35 %</option><option value=".5" selected>50 %</option><option value=".75">75 %</option><option value="1">100 %</option></select></label>
    <button id="undo">RÜCKGÄNGIG</button>
    <button id="exportBtn">EXPORT</button>
    <button id="importBtn">IMPORT</button>
    <button id="play" class="go">TESTSPIELEN ▶</button>
    <a href="index.html">zum Spiel</a>
  </header>
  <main>
    <div class="tools" id="tools">
      <button data-tool="select" class="on">ZEIGER / VERSCHIEBEN</button>
      <button data-tool="ground">BODEN</button>
      <button data-tool="float">PLATTFORM</button>
      <button data-tool="coin">MÜNZE</button>
      <button data-tool="heart">HERZ</button>
      <button data-tool="enemy">GEGNER</button>
      <label>Gegnertyp<br><select id="enemyType"><option value="0">Bär</option><option value="1">Fuchs</option><option value="2">Giraffe</option><option value="3">Nilpferd</option><option value="4">Bug</option></select></label>
      <button data-tool="spring">TRAMPOLIN</button>
      <button data-tool="hazard">STACHELN</button>
      <button data-tool="mover">BEWEGTE PLATTFORM</button>
      <label>Art<br><select id="moverStyle"><option value="boat">Boot (waagerecht)</option><option value="lift">Kranlast (waagerecht)</option><option value="gondel">Gondel (senkrecht)</option><option value="korb">Korb (senkrecht)</option><option value="seilbahn">Seilbahn (schräg)</option></select></label>
      <button data-tool="updraft">LÜFTER-AUFWIND</button>
      <button data-tool="sign">ZONENSCHILD</button>
      <button data-tool="flag">ZIEL-FAHNE</button>
      <button data-tool="erase">RADIERER</button>
    </div>
    <div class="view" id="view"><canvas id="ed"></canvas></div>
    <aside>
      <h2>AUSWAHL</h2>
      <div id="props"><p>Nichts ausgewählt. Klick ein Objekt mit dem Zeiger an. Plattformen kannst du am rechten Rand breiter ziehen, Entf löscht.</p></div>
      <h2>LEVEL</h2>
      <div class="row"><label>Titel</label><input id="title" style="width:180px"></div>
      <div class="row"><label>Breite</label><input id="worldW" type="number" step="100"></div>
      <h2>ZONEN</h2>
      <div id="zones"></div>
      <button id="addZone">ZONE HINZUFÜGEN</button>
    </aside>
  </main>
  <footer><span id="status">Bereit.</span><span>Raster 10 px · Boden liegt bei y = 610 · Mausrad scrollt seitlich</span></footer>

  <dialog id="dlg">
    <p id="dlgText"></p>
    <textarea id="dlgArea" spellcheck="false"></textarea>
    <div class="row"><button id="dlgCopy">KOPIEREN</button><button id="dlgOk" class="go">ÜBERNEHMEN</button><button id="dlgClose">SCHLIESSEN</button></div>
  </dialog>

  <script src="js/levels.js"></script>
  <script src="js/music.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
